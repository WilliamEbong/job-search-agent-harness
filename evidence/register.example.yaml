# `status` and `qualifier_required` are the load-bearing fields. A credential
# that is in progress may NEVER render without its qualifier — "Google Data
# Analytics Certificate" on a CV reads as earned, and that is a lie the
# candidate would have to defend in an interview. Check 4 in fact_check.py
