# Lexicon entries that are also ordinary English words. These are matched
# CASE-SENSITIVELY against the original text instead of the lowercased copy.
#
# Why this exists: the check lowercases everything before matching, so a CV
# saying "the spring sampling programme", "go further than the brief" or
# "react to the results" was reported as claiming the Spring framework, the Go
# language and React. That is a false red line, and false red lines are
# corrosive — they train the operator to wave the checker through.
#
# This does not weaken the check. Genuine keyword stuffing capitalises the
# technology ("experience with Go and Rust", "Spring Boot"), which still
# matches. Pinned by test_common_english_words_are_not_technology_claims.
case_sensitive_lexicon:
  - Go
  - Spring
  - Swift
  - Rust
  - React
  - Angular
  - Oracle
  - Spark
  - Ruby

# ---------------------------------------------------------------------------
# Machine-checkable positioning constraints, keyed by register constraint id.
constraint_patterns:

  # For a candidate who directs AI coding tools but is not a programmer by
  # trade. The failure this prevents is real and specific: a drafter reaching
  # for flattering verbs turns "used Claude Code to build a workflow" into
  # "engineered a data pipeline", which reads to an interviewer as a claim of
  # software-engineering experience the candidate cannot back in a technical
  # screen.
  #
  # `exemption_markers` are the honest framings. When one appears near the
  # match, the sentence is already truthful and the pattern stands down.
  programming_claims:
    description: >-
      Blocks self-descriptions as a professional developer, claims of
      programming-language fluency, and bare build verbs about software, unless
      the surrounding sentence carries the AI-assisted framing.
    exemption_markers:
      - ai-assisted
      - ai assisted
      - claude code
      - ai coding
      - ai-directed
      - ai tools
      - with ai
    # Each regex is ONE single-quoted line on purpose. A YAML folded scalar
    # (`>-`) replaces every line break with a space, which would silently turn
    # `(python|typescript|\n javascript)` into an alternative that only matches
    # " javascript" with a leading space — a pattern that still compiles and
    # still looks right, but no longer catches what it was written to catch.
    patterns:
      - regex: '\b(software (developer|engineer)|programmer|full[- ]stack developer|web developer|backend developer|frontend developer|data engineer)\b'
        description: self-describes as a developer/engineer
      - regex: '\b(proficient|fluent|expert|experienced|skilled|strong)\s+(in|with|at)\s+(python|typescript|javascript|java\b|c\+\+|c#|sql\s+development|programming|coding)'
        description: claims programming-language fluency
      - regex: '\b(i|who)?\s*\b(coded|programmed)\b'
        description: uses the bare verb coded/programmed
      - regex: '\b(developed|engineered|built)\s+(a|an|the)\s+[^.,;]{0,40}(application|app|software|platform|website|web app|pipeline|api|codebase)\b'
        description: bare developed/engineered/built about a software project (needs the AI-assisted framing)
