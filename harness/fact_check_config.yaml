# Candidate-agnostic configuration for harness/fact_check.py.
#
# Nothing here describes a person. It describes two things the checker cannot
# derive from an evidence register:
#
#   1. `tech_lexicon` — technologies job postings commonly ask for. The checker
#      flags any of these that appear in a draft but NOT in the register, which
#      is what posting-keyword leakage looks like.
#
#   2. `constraint_patterns` — the machine-checkable form of a positioning
#      constraint. A register entry under `positioning_constraints` states the
#      rule in prose ("never self-describe as a software developer"); prose is
#      not checkable, so the regexes live here, keyed by the constraint's `id`.
#
# The gate that keeps this candidate-agnostic: **a pattern family only runs if
# the user's own register declares a positioning_constraint with that id.** A
# candidate who really is a software engineer simply has no `programming_claims`
# constraint, and none of these patterns ever fire for them.
#
# Extending this file is how the checker gets stronger. Weakening it to make a
# specific draft pass is forbidden — see the resolution table in
# .claude/commands/verify-facts.md.

# ---------------------------------------------------------------------------
# Technologies a posting commonly asks for.
#
# Known ceiling, stated rather than hidden: this is a lexicon, so it cannot
# flag a technology nobody listed here. Broaden it when a real draft slips one
# through, and pin the new case with a fixture — never speculatively.
tech_lexicon:
  # Cloud and infrastructure
  - AWS
  - Amazon Web Services
  - Azure
  - Google Cloud
  - GCP
  - Docker
  - Kubernetes
  - Terraform
  - Jenkins
  # Data platforms
