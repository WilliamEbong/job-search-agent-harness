# Rules about how this candidate may be positioned. The `id` is the hinge:
# harness/fact_check_config.yaml holds the machine-checkable regexes for each
# id, and a family runs ONLY when the id appears here. Delete a constraint and
# its patterns stop firing; that is how the same checker serves a lab
# technician and a software engineer without either one being mis-policed.
positioning_constraints:
  - id: programming_claims
    rule: >-
      Riley automates work by directing AI coding tools, not by writing
      production software. Never self-describe as a developer, engineer or
      programmer, and never claim fluency in a programming language.
    banned_phrasings:
      - software developer
      - proficient in Python
      - built a data pipeline
    sanctioned_phrasings:
      - built an AI-assisted reporting workflow using Claude Code
      - automated the monthly summary with AI coding tools
      - directed AI tooling to replace a manual reporting step
    rationale: >-
      A technical screen would expose an unsupported engineering claim
      immediately, and the honest version is a genuine strength: the work
      shipped and the results are real.
    source: owner-confirmed 2026-08-04

  - id: management_claims
    rule: >-
      Riley has coordinated volunteers and led projects, but has never held
      direct reports. Do not imply people-management authority.
    banned_phrasings:
      - managed a team of
      - direct reports
    sanctioned_phrasings:
      - coordinated a volunteer team of
      - led the sampling project end to end
    rationale: >-
      "Managed a team" invites a question about headcount and performance
      reviews that the evidence cannot support.
    source: owner-confirmed 2026-08-04

# Tiered technology claims. The tier decides the strongest honest verb, so this
# section is what keeps "used" from drifting into "engineered".
technology_claim_rules:
  direct:
    - Excel
    - R
    - LIMS
    - QGIS
  ai-assisted:
    - Python
    - SQL
  familiarity_only:
    - Power BI
  note: >-
    `direct` may be claimed as hands-on use. `ai-assisted` must carry the
    AI-assisted framing. `familiarity_only` may be described as exposure, never
    as a working skill.
  source: owner-confirmed 2026-08-04

