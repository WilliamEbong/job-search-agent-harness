# Evidence register — documented schema, filled with a FICTIONAL demo candidate.
#
# ---------------------------------------------------------------------------
# EVERYTHING IN THIS FILE IS INVENTED. Riley Chen does not exist. The employers,
# schools, metrics and repositories are fabricated for testing, screenshots and
# the fresh-install walkthrough. Contact details use the reserved example.com
# domain and the 555-01xx phone range precisely so they cannot reach a real
# person. Do not treat any line here as a real career fact.
# ---------------------------------------------------------------------------
#
# WHAT THIS FILE IS FOR
#
# The register is the answer to one question: *what may this candidate claim?*
# `/apply` may rephrase, reorder, translate into an employer's vocabulary and
# argue for transferable relevance — but it may not assert a fact that is not
# here. `harness/fact_check.py` enforces that mechanically and blocks delivery
# of any package containing an unsupported hard fact.
#
# THE ONE INVARIANT: every entry carries a `source:`.
#
# A source is either a path to a document the fact came from, or
# `owner-confirmed <YYYY-MM-DD>` for something the candidate stated directly.
# An entry without a source is a rumour, and a register full of rumours is
# indistinguishable from a language model's imagination.
#
# HOW ENTRIES GET HERE
#
# Two sanctioned routes, and no others: `/setup` reads your documents during
# onboarding, and `/fact` records something you confirm in conversation. Never
# hand-edit this file to clear a fact-check red line — that inverts the whole
# point. A red line means the draft claims something unevidenced; either the
# claim is false (fix the draft) or it is true (confirm it via `/fact`).
#
# TO USE IT: copy to `evidence/register.yaml` (gitignored) and let `/setup`
# fill it from your own documents.

